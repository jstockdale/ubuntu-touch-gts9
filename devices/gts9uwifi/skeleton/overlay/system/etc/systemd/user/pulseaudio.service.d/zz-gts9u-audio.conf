[Service]
# gts9u: wait for the FULL bring-up (card + latch + fresh container HAL),
# signaled by the flag file. No '-': if bring-up never finishes, PA must
# not start - a start against a half-ready stack is a shim SEGV loop.
# Budget note (2026-08-31 review): bring-up worst case is ~315s
# (120 modules + 90 card + 60 latch + 30 HAL + 15 h2w; its unit allows 360)
# while this gate caps at 150s. Deliberate: 150s covers every observed boot
# with margin; a boot slow enough to blow it has deeper problems, and PA
# retries on the next session login rather than starting half-ready.
ExecStartPre=/usr/bin/timeout 150 /bin/sh -c 'until [ -e /run/gts9u-audio-ready ]; do sleep 1; done'
ExecStart=
ExecStart=/usr/bin/env -u HYBRIS_USE_VENDOR_NAMESPACE /usr/bin/pulseaudio --daemonize=no --log-target=journal
MemoryDenyWriteExecute=no
SystemCallFilter=
SystemCallArchitectures=
LockPersonality=no
RestrictNamespaces=no
