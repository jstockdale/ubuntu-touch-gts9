# The msm-eud extcon reports USB=0 even with a cable attached, so the cable has
# to be accepted on charger voltage (-f). The long --fallback must not be used:
# in usb-moded 0.86 its getopt entry aliases to -d (diag mode), which hides
# every normal mode and leaves only diag_mode.
[Service]
ExecStart=
ExecStart=/usr/sbin/usb_moded --systemd --force-syslog -f
