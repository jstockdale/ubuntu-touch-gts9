# The msm-eud extcon reports USB=0 even with a cable attached, so the cable has
# to be accepted on charger voltage (-f). The long --fallback must not be used:
# in usb-moded 0.86 its getopt entry aliases to -d (diag mode), which hides
# every normal mode and leaves only diag_mode.
#
# NOTE (2026-08-31): currently UNREACHABLE in the shipped configuration -
# gts9-adb-gadget masks and kills usb-moded on every boot and gts9-adb.service
# sets Conflicts=usb-moded.service (static gadget won). Kept because the -f
# analysis above is hard-won and required the moment usb-moded is re-enabled;
# do NOT debug the -f path on an image running the gts9-adb static gadget.
[Service]
ExecStart=
ExecStart=/usr/sbin/usb_moded --systemd --force-syslog -f
