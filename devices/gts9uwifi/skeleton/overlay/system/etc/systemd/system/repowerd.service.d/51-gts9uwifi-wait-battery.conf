# repowerd polls upower once at startup; if it wins the race against upower's
# first battery refresh it reads 0.0%, declares critical and powers the
# system off in a loop. Hold repowerd until upower reports a real percentage.
[Service]
ExecStartPre=-/bin/sh -c 'i=0; while [ $$i -lt 30 ]; do p=$$(busctl --system get-property org.freedesktop.UPower /org/freedesktop/UPower/devices/battery_battery org.freedesktop.UPower.Device Percentage 2>/dev/null | cut -d" " -f2); case "$${p%%.*}" in ""|0) sleep 1; i=$$((i+1));; *) exit 0;; esac; done; exit 0'
