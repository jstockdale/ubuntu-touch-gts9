# ep0 closes on adbd whenever the gadget rebinds (host-mode role swap, dwc3
# core reset); restart adbd itself first since that is the cheap fix, and
# escalate to a full gadget rebuild if it keeps failing (the mount/config may
# be gone, not just the daemon)
[Unit]
StartLimitIntervalSec=30
StartLimitBurst=3
OnFailure=gts9-adb-recover.service

[Service]
Restart=on-failure
RestartSec=1
