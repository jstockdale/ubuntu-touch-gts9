# Lomiri fd-exhaustion mitigation: under client churn (e.g. a Qt client
# crash-looping with zero EGLConfigs) the greeter exhausts the default
# 1024-fd limit and dies with GLib "Too many open files" -> SIGTRAP.
# Root-caused on gts9wifi 2026-08-30 (krita/GLES incident); the robustness
# bug is device-independent, so the belt ships family-wide.
[Service]
LimitNOFILE=65536
