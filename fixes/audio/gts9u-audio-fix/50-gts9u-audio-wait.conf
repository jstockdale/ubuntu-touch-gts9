# gts9uwifi: start pulseaudio only once the sound card is ONLINE, i.e. once
# /sys/kernel/snd_card/card_state reads 1 - the exact condition AGM's
# wait_for_snd_card_to_online() polls in-process inside PA.
#
# Modeled on Azkali's 50-gts9wifi-wait-audiohal.conf but gated on the
# kernel-side condition directly instead of getprop init.svc.vendor.audio-hal.
# Deliberately written without any '$': systemd expands bare $var words in
# Exec lines (Azkali's `$c` counter is likely mangled by this), so command
# substitution here uses backticks and the time cap uses timeout(1).
#
# The leading '-' keeps PA non-fatal if the wait times out; AGM's own
# 100 x 1 s retry loop is the backstop.
#
# Install: /etc/systemd/user/pulseaudio.service.d/50-gts9u-audio-wait.conf
# Keep existing HYBRIS_LD_LIBRARY_PATH env drop-ins untouched.

[Service]
ExecStartPre=-/usr/bin/timeout 90 /bin/sh -c 'until [ "`cat /sys/kernel/snd_card/card_state 2>/dev/null`" = "1" ]; do sleep 1; done'
ExecStart=
ExecStart=/usr/bin/env -u HYBRIS_USE_VENDOR_NAMESPACE /usr/bin/pulseaudio --daemonize=no --log-target=journal
