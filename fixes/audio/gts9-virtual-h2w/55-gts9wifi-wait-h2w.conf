[Service]
# Gate PA on the virtual jack existing (hard-fail, no '-' prefix).
# $$ everywhere: systemd expands bare $c before the shell runs (the old
# form's 60s cap never fired - found 2026-08-31).
ExecStartPre=/bin/sh -c 'c=0; until grep -q gts9-virtual-h2w /proc/bus/input/devices; do [ $$c -ge 60 ] && exit 1; sleep 1; c=$$((c+1)); done'
